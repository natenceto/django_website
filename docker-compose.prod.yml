x-django-common-env: &django-common-env
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  ALLOWED_HOSTS: localhost,127.0.0.1,192.168.88.247
  CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1,http://192.168.88.247,https://localhost,https://127.0.0.1,https://192.168.88.247
  CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://192.168.88.247,https://localhost,https://127.0.0.1,https://192.168.88.247
  POSTGRES_DB: ${POSTGRES_DB:-renew_db}
  POSTGRES_USER: ${POSTGRES_USER:-renew_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  USE_REDIS_CHANNEL_LAYER: 1
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: renew_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Channel Layer & Celery
  redis:
    image: redis:7-alpine
    container_name: renew_redis_prod
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Application - Gunicorn Uvicorn
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renew_web_prod
    command: gunicorn renew_website.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      <<: *django-common-env
      DEBUG: False
      RUN_DB_MIGRATIONS: 1
      RUN_COLLECTSTATIC: 1
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-0}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker
  celery:
    build: .
    container_name: renew_celery_worker_prod
    command: celery -A renew_website worker --loglevel=info
    environment:
      <<: *django-common-env
      DEBUG: False
      RUN_DB_MIGRATIONS: 0
      RUN_COLLECTSTATIC: 0
    restart: unless-stopped
    depends_on:
      - db
      - redis

  # Celery Beat
  celery-beat:
    build: .
    container_name: renew_celery_beat_prod
    command: celery -A renew_website beat --loglevel=info
    environment:
      <<: *django-common-env
      DEBUG: False
      RUN_DB_MIGRATIONS: 0
      RUN_COLLECTSTATIC: 0
    restart: unless-stopped
    depends_on:
      - db
      - redis

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: renew_nginx_prod
    ports:
      - "127.0.0.1:80:80"
      - "192.168.88.247:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
