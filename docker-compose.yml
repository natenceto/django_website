services:
  db:
    image: postgres:15-alpine
    container_name: renew_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renew_db}
      POSTGRES_USER: ${POSTGRES_USER:-renew_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - renew_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renew_user} -d ${POSTGRES_DB:-renew_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: renew_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - renew_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: renew_web
    # Махаме --reload за по-голяма стабилност на сокетите, ако не си в чист dev режим
    command: uvicorn renew_website.asgi:application --host 0.0.0.0 --port 8000 --ws-ping-interval 60
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    # Махаме ports 8000:8000, за да минава всичко само през Nginx (сигурност)
    expose:
      - "8000"
    networks:
      - renew_net
    environment:
      - DEBUG=1
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      # ДОБАВИ РЕАЛНОТО IP ТУК:
      - ALLOWED_HOSTS=localhost,127.0.0.1,web,192.168.88.247,192.168.122.246
      - POSTGRES_DB=${POSTGRES_DB:-renew_db}
      - POSTGRES_USER=${POSTGRES_USER:-renew_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    container_name: renew_celery_worker
    command: celery -A renew_website worker --loglevel=info
    volumes:
      - .:/app
    networks:
      - renew_net
    environment:
      - POSTGRES_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - web

  nginx:
    image: nginx:1.25-alpine
    container_name: renew_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/app/staticfiles
    networks:
      - renew_net
    depends_on:
      - web

networks:
  renew_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume: