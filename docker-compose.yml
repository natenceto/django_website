services:
  # Base Database Service
  db:
    image: postgres:15-alpine
    container_name: renew_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renew_db}
      POSTGRES_USER: ${POSTGRES_USER:-renew_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renew_user} -d ${POSTGRES_DB:-renew_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: renew_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Application (ASGI/Uvicorn)
  web:
    build: .
    container_name: renew_web
    command: uvicorn renew_website.asgi:application --host 0.0.0.0 --port 8000 --ws-ping-interval 60 --reload
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      - DEBUG=1
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - ALLOWED_HOSTS=localhost,127.0.0.1,web,192.168.88.247,*
      - POSTGRES_DB=${POSTGRES_DB:-renew_db}
      - POSTGRES_USER=${POSTGRES_USER:-renew_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUN_DB_MIGRATIONS=1
      - RUN_COLLECTSTATIC=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker
  celery:
    build: .
    container_name: renew_celery_worker
    command: celery -A renew_website worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - POSTGRES_DB=${POSTGRES_DB:-renew_db}
      - POSTGRES_USER=${POSTGRES_USER:-renew_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUN_DB_MIGRATIONS=0
      - RUN_COLLECTSTATIC=0
    depends_on:
      - db
      - redis
      - web

  # Celery Beat (Periodic Tasks)
  celery-beat:
    build: .
    container_name: renew_celery_beat
    command: celery -A renew_website beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - POSTGRES_DB=${POSTGRES_DB:-renew_db}
      - POSTGRES_USER=${POSTGRES_USER:-renew_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUN_DB_MIGRATIONS=0
      - RUN_COLLECTSTATIC=0
    depends_on:
      - db
      - redis
      - web

  # Celery Monitoring (Flower)
  flower:
    build: .
    container_name: renew_flower
    command: celery -A renew_website flower --port=5555
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-renew_db}
      - POSTGRES_USER=${POSTGRES_USER:-renew_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - celery

volumes:
  postgres_data:
  redis_data:
  static_volume:
