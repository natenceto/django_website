# Docker Compose for EV Charging Platform - Development
version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ev_charging_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renew_db}
      POSTGRES_USER: ${POSTGRES_USER:-renew_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Use 5433 to avoid conflict with local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renew_user} -d ${POSTGRES_DB:-renew_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Channel Layer
  redis:
    image: redis:7-alpine
    container_name: ev_charging_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Application
  web:
    build: .
    container_name: ev_charging_web
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000
      - POSTGRES_DB=${POSTGRES_DB:-renew_db}
      - POSTGRES_USER=${POSTGRES_USER:-renew_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             uvicorn renew_website.asgi:application --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  redis_data:
  static_volume:
