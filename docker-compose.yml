x-django-common-env: &django-common-env
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  ALLOWED_HOSTS: localhost,127.0.0.1,192.168.88.247
  CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1,http://192.168.88.247,http://localhost:8000,http://127.0.0.1:8000,http://192.168.88.247:8000
  CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://192.168.88.247,http://localhost:8000,http://127.0.0.1:8000,http://192.168.88.247:8000
  POSTGRES_DB: ${POSTGRES_DB:-renew_db}
  POSTGRES_USER: ${POSTGRES_USER:-renew_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  USE_REDIS_CHANNEL_LAYER: 1
  DEYE_CONNECTION_MODE: ${DEYE_CONNECTION_MODE:-local}
  DEYE_MASTER_LOCAL_IP: ${DEYE_MASTER_LOCAL_IP:-192.168.88.253}
  DEYE_LOGGER_SN: ${DEYE_LOGGER_SN:-3117882047}

services:
  # Base Database Service
  db:
    image: postgres:15-alpine
    container_name: renew_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renew_db}
      POSTGRES_USER: ${POSTGRES_USER:-renew_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renew_user} -d ${POSTGRES_DB:-renew_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: renew_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Application (ASGI/Uvicorn)
  web:
    build: .
    container_name: renew_web
    command: uvicorn renew_website.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      <<: *django-common-env
      DEBUG: 1
      RUN_DB_MIGRATIONS: 1
      RUN_COLLECTSTATIC: 1
      ENABLE_API_DOCS: 1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker
  celery:
    build: .
    container_name: renew_celery_worker
    command: celery -A renew_website worker --loglevel=info
    volumes:
      - .:/app
    environment:
      <<: *django-common-env
      DEBUG: 1
      RUN_DB_MIGRATIONS: 0
      RUN_COLLECTSTATIC: 0
    depends_on:
      - db
      - redis
      - web

  # Celery Beat (Periodic Tasks)
  celery-beat:
    build: .
    container_name: renew_celery_beat
    command: celery -A renew_website beat --loglevel=info
    volumes:
      - .:/app
    environment:
      <<: *django-common-env
      DEBUG: 1
      RUN_DB_MIGRATIONS: 0
      RUN_COLLECTSTATIC: 0
    depends_on:
      - db
      - redis
      - web

  # Celery Monitoring (Flower)
  flower:
    build: .
    container_name: renew_flower
    command: celery -A renew_website flower --port=5555
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      <<: *django-common-env
    depends_on:
      - redis
      - celery

volumes:
  postgres_data:
  redis_data:
  static_volume:
