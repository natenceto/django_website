x-django-common-env: &django-common-env
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  ALLOWED_HOSTS: localhost,127.0.0.1,192.168.88.247
  CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1,http://192.168.88.247,http://localhost:8000,http://127.0.0.1:8000,http://192.168.88.247:8000
  CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://192.168.88.247,http://localhost:8000,http://127.0.0.1:8000,http://192.168.88.247:8000
  POSTGRES_DB: ${POSTGRES_DB:-renew_db}
  POSTGRES_USER: ${POSTGRES_USER:-renew_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  USE_REDIS_CHANNEL_LAYER: 1

services:
  # Base Database Service
  db:
    image: postgres:15-alpine
    container_name: renew_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renew_db}
      POSTGRES_USER: ${POSTGRES_USER:-renew_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renew_user} -d ${POSTGRES_DB:-renew_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: renew_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Application (ASGI/Uvicorn)
  web:
    build: .
    container_name: renew_web
    command: uvicorn renew_website.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      <<: *django-common-env
      LOG_FILE: /app/logs/web.jsonl
      DEBUG: 1
      RUN_DB_MIGRATIONS: 1
      RUN_COLLECTSTATIC: 1
      ENABLE_API_DOCS: 1
      DEYE_CONNECTION_MODE: auto
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker
  celery:
    build: .
    container_name: renew_celery_worker
    restart: unless-stopped
    command: celery -A renew_website worker --loglevel=info --events
    volumes:
      - .:/app
    environment:
      <<: *django-common-env
      LOG_FILE: /app/logs/celery-worker.jsonl
      DEBUG: 1
      RUN_DB_MIGRATIONS: 0
      RUN_COLLECTSTATIC: 0
    depends_on:
      - db
      - redis
      - web

  # Celery Beat (Periodic Tasks)
  celery-beat:
    build: .
    container_name: renew_celery_beat
    command: celery -A renew_website beat --loglevel=info
    volumes:
      - .:/app
    environment:
      <<: *django-common-env
      LOG_FILE: /app/logs/celery-beat.jsonl
      DEBUG: 1
      RUN_DB_MIGRATIONS: 0
      RUN_COLLECTSTATIC: 0
    depends_on:
      - db
      - redis
      - web

  # Celery Monitoring (Flower)
  flower:
    build: .
    container_name: renew_flower
    command: celery -A renew_website flower --address=0.0.0.0 --port=5555
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-renew_db}
      - POSTGRES_USER=${POSTGRES_USER:-renew_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_FILE=/app/logs/flower.jsonl
    depends_on:
      - redis
      - celery

  # Centralized application log storage and dashboards
  loki:
    image: grafana/loki:3.5.0
    container_name: renew_loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: renew_alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/renew:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: renew_grafana
    ports:
      - "${GRAFANA_BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources/loki.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - ./observability/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  loki_data:
  grafana_data:
  alloy_data:
